[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alibirds-backend"
version = "1.0.0"
description = "AliBirds — Dutch ZZP Accounting & Invoicing Platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",       # async SQLite driver
    "asyncpg>=0.29.0",          # async PostgreSQL driver (optional)

    # Configuration & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",

    # PDF generation
    "weasyprint>=62.0",
    "jinja2>=3.1.0",

    # Email
    "aiosmtplib>=3.0.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # MT940 bank parsing
    "mt940>=4.30.0",

    # String matching for reconciliation
    "rapidfuzz>=3.9.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Utilities
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "babel>=2.15.0",            # Dutch locale formatting
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
